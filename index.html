<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>NovaTap</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Script Oficial de Adsgram -->
    <script src="https://sad.adsgram.ai/js/sad-index.js"></script>
    <style>
        * { box-sizing: border-box; user-select: none; }
        body {
            background: radial-gradient(circle at top, #1a1f36 0%, #0a0c16 100%);
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0; padding: 15px;
            height: 100vh;
            display: flex; flex-direction: column; justify-content: space-between;
            overflow: hidden;
        }
        .header {
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.05); padding: 10px 15px; border-radius: 15px;
            border: 1px solid rgba(0, 210, 255, 0.2);
        }
        .user-rank { font-size: 14px; color: #00d2ff; font-weight: bold; }
        .title { font-size: 22px; font-weight: bold; color: #00d2ff; }
        
        .tab-content { display: none; flex-direction: column; align-items: center; width: 100%; }
        .tab-content.active { display: flex; }

        .score-container { margin: 15px 0; }
        .points-display { font-size: 40px; font-weight: bold; color: #fff; text-shadow: 0 0 15px rgba(0,210,255,0.6); }

        .tap-area { position: relative; display: flex; justify-content: center; align-items: center; margin: 15px 0; }
        .coin-btn {
            width: 190px; height: 190px; border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #00f2fe 0%, #4facfe 100%);
            border: 5px solid #ffffff; box-shadow: 0 0 30px rgba(79, 172, 254, 0.6);
            display: flex; align-items: center; justify-content: center; font-size: 80px;
            cursor: pointer; transition: transform 0.08s ease;
        }
        .coin-btn:active { transform: scale(0.92); }

        .float-text {
            position: absolute; font-size: 32px; font-weight: bold; color: #00f2fe;
            pointer-events: none; animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.3); }
        }

        .energy-container {
            width: 100%; background: rgba(255, 255, 255, 0.05); padding: 12px;
            border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .energy-info { display: flex; justify-content: space-between; font-size: 14px; color: #a0aec0; margin-bottom: 6px; }
        .progress-bar-bg { width: 100%; height: 10px; background: #161b26; border-radius: 10px; overflow: hidden; }
        .progress-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #00d2ff, #0052d4); }

        .btn-ad {
            background: linear-gradient(90deg, #ff9900, #ff5500); border: none; color: white;
            padding: 10px 15px; border-radius: 12px; font-weight: bold; font-size: 14px;
            cursor: pointer; width: 100%; margin-top: 10px; box-shadow: 0 0 15px rgba(255, 153, 0, 0.4);
        }

        /* Navegación */
        .navbar {
            display: flex; justify-content: space-around; background: #121624;
            padding: 10px 0; border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .nav-btn {
            background: none; border: none; color: #8a99ad; font-size: 12px;
            display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;
        }
        .nav-btn.active { color: #00d2ff; font-weight: bold; }
        .nav-btn span { font-size: 20px; }

        .ref-box {
            background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 15px;
            width: 100%; margin: 15px 0; border: 1px solid rgba(0, 210, 255, 0.2);
        }
        .btn-invite {
            background: linear-gradient(90deg, #00d2ff, #0052d4); border: none; color: white;
            padding: 12px 20px; border-radius: 12px; font-weight: bold; font-size: 16px;
            cursor: pointer; width: 100%; margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="title">NOVATAP</div>
        <div class="user-rank">👑 Rango: Novato</div>
    </div>

    <!-- PESTAÑA JUEGO -->
    <div id="tabGame" class="tab-content active">
        <div class="score-container">
            <div class="points-display">🪙 <span id="points">0</span></div>
        </div>

        <div class="tap-area" id="tapArea">
            <div class="coin-btn" id="tapBtn">💎</div>
        </div>

        <div class="energy-container">
            <div class="energy-info">
                <span>🔋 Energía</span>
                <span><strong id="energy">1000</strong> / 1000</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="energyFill"></div>
            </div>
            <button class="btn-ad" id="adBtn">📺 Ver Anuncio para Recargar Energía (+1000)</button>
        </div>
    </div>

    <!-- PESTAÑA AMIGOS -->
    <div id="tabFriends" class="tab-content">
        <h2>👥 Invita Amigos</h2>
        <p style="color: #a0aec0; font-size: 14px;">¡Gana +5,000 puntos por cada amigo que se una!</p>
        
        <div class="ref-box">
            <h3>Amigos Invitados: <span id="refCount" style="color: #00d2ff;">0</span></h3>
            <button class="btn-invite" id="inviteBtn">🚀 Invitar a un Amigo</button>
        </div>
    </div>

    <!-- NAVEGACIÓN -->
    <div class="navbar">
        <button class="nav-btn active" onclick="switchTab('tabGame', this)"><span>🎮</span> Juego</button>
        <button class="nav-btn" onclick="switchTab('tabFriends', this)"><span>👥</span> Amigos</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const userId = tg.initDataUnsafe?.user?.id || 12345678;
        const startParam = tg.initDataUnsafe?.start_param || "";
        const refId = startParam.replace('ref_', '');

        const pointsEl = document.getElementById('points');
        const energyEl = document.getElementById('energy');
        const energyFill = document.getElementById('energyFill');
        const refCountEl = document.getElementById('refCount');
        const tapBtn = document.getElementById('tapBtn');
        const tapArea = document.getElementById('tapArea');

        let maxEnergy = 1000;

        // BLOCK ID DE ADSGRAM CONFIGURADO
        const BLOCK_ID = "50206";
        let AdController = null;

        if (window.Adsgram) {
            AdController = window.Adsgram.init({ blockId: BLOCK_ID });
        }

        // Cargar datos
        fetch(`/api/user/${userId}?ref=${refId}`)
            .then(res => res.json())
            .then(data => {
                pointsEl.innerText = data.points;
                energyEl.innerText = data.energy;
                if (refCountEl) refCountEl.innerText = data.referral_count;
                updateBar(data.energy);
            });

        function updateBar(energy) {
            energyFill.style.width = `${(energy / maxEnergy) * 100}%`;
        }

        tapBtn.addEventListener('pointerdown', (e) => {
            fetch('/api/tap', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: userId })
            })
            .then(res => res.json())
            .then(data => {
                if (data.points !== undefined) {
                    pointsEl.innerText = data.points;
                    energyEl.innerText = data.energy;
                    updateBar(data.energy);

                    const floatEl = document.createElement('div');
                    floatEl.className = 'float-text';
                    floatEl.innerText = `+${data.earned || 1}`;
                    const rect = tapArea.getBoundingClientRect();
                    floatEl.style.left = `${e.clientX - rect.left - 15}px`;
                    floatEl.style.top = `${e.clientY - rect.top - 20}px`;
                    tapArea.appendChild(floatEl);
                    setTimeout(() => floatEl.remove(), 800);
                }
            });
        });

        // Evento Ver Anuncio
        document.getElementById('adBtn').addEventListener('click', () => {
            if (!AdController) {
                alert("El sistema de anuncios se está cargando...");
                return;
            }

            AdController.show().then((result) => {
                // Anuncio completado con éxito: dar recompensa
                alert("🎉 ¡Gracias por ver el anuncio! Tu energía ha sido restaurada a 1000.");
                energyEl.innerText = 1000;
                updateBar(1000);
            }).catch((error) => {
                alert("Debes ver el video completo para recibir la recompensa.");
            });
        });

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
        }

        document.getElementById('inviteBtn').addEventListener('click', () => {
            const inviteUrl = `https://t.me/NovaTapGame_bot/app?startapp=ref_${userId}`;
            const shareText = `¡Únete a NovaTap conmigo y gana 5,000 puntos gratis! 🪙⚡`;
            
            if (tg.openTelegramLink) {
                tg.openTelegramLink(`https://t.me/share/url?url=${encodeURIComponent(inviteUrl)}&text=${encodeURIComponent(shareText)}`);
            } else {
                navigator.clipboard.writeText(inviteUrl);
                alert("¡Enlace copiado!");
            }
        });
    </script>
</body>
</html>
